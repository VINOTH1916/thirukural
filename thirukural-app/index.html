<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>திருக்குறள் – பரிமேலழகர் உரை</title>
    <!-- Prevent flash of wrong theme -->
    <script>
      (function(){
        var t = localStorage.getItem('thirukural-theme');
        document.documentElement.setAttribute('data-theme', ['satva','rajas','tamas'].includes(t) ? t : 'tamas');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Catamaran      — Tamil UI text (clean, geometric, all weights)
      Noto Serif Tamil — Tamil verse / classical text (elegant serif)
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Catamaran:wght@300;400;500;600;700;800&family=Noto+Serif+Tamil:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
